<div class="flex flex-col flex-1 overflow-y-auto bg-[#F4F2EE]">
    <div class="flex items-center justify-between h-20 sm:h-10">
        <div class="flex items-center px-4">
            <label for="menu-toggle"
                class="inline-flex items-center text-sm text-gray-500 rounded-lg sm:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 20 20"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </label>
        </div>
    </div>

    <div class="p-4 overflow-hidden sm:ml-64 min-h-screen">
        <div class="container p-4">
            <div class="flex gap-4 flex-col lg:flex-row">
                <div class="lg:w-2/3">
                    <h1 class="text-5xl font-semibold mb-4 md:mb-4">{{mealss.strMeal}}</h1>
                    <div class="flex flex-col lg:flex-row gap-4">
                        <div class="lg:w-1/2 flex flex-col">
                            <img [src]="mealss.strMealThumb" class="w-full rounded-2xl" alt="">
                            <div class="flex gap-4 justify-center mt-4">
                                <button class="bg-red-600 text-white py-2 px-4 rounded-lg">
                                    <a class="flex gap-2 justify-center items-center" [href]="mealss.strYoutube">
                                        <i class="fab fa-youtube"></i>
                                        youtube 
                                    </a>
                                </button>
                                <button class="bg-[#21BA75] text-white py-2 px-4 rounded-lg">
                                    <a class="flex gap-2 justify-center items-center" [href]="mealss.strSource">
                                        <i class="fas fa-globe"></i>
                                        source 
                                    </a>
                                </button>
                            </div>
                        </div>
                        <div class="lg:w-1/2">
                            <p class="text-justify">{{mealss.strInstructions}}</p>
                        </div>
                    </div>
                </div>
                <div class="lg:w-1/3 p-4">
                    <ul class="bg-white rounded-2xl p-4">
                        <h3 class="text-2xl font-semibold mb-4 border-b-4 p-2 capitalize">ingredients</h3>
                        <!-- <div class="divide-y">
                            @for (ing of mIngredients ; track $index) {
                                @if(ing !== ''){
                                    <li  class="flex justify-between p-2 border-b-2 last-of-type:border-b-0">{{ing}} </li>
                                }
                            }
                            @for (m of mMeasures ; track $index) {
                                @if(m !== ''){
                                    <li  class="flex justify-between p-2 border-b-2 last-of-type:border-b-0 ">{{m}} </li>
                                }
                            }
                        </div> -->

                        @for (item of mIngredients; track $index) {
                            @if (item !== '') {
                                <li class="flex justify-between p-2 border-b-2 last-of-type:border-b-0">
                                    <span>{{item}}</span>
                                    <span>{{mMeasures[$index]}}</span>
                                </li>
                            }
                        }
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
